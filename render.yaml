# Render Blueprint — prepared for a FIRST deploy on Render's current free
# tier, NOT deployed yet. See docs/DEPLOYMENT.md for the full walkthrough,
# including exactly what free vs. paid plans support here and why.
#
# No secret VALUES live here. Anything marked `sync: false` must be entered
# once in the Render dashboard. APP_KEY specifically must be generated
# locally with `php artisan key:generate --show` and pasted in — Render's
# own generateValue:true produces a generic random string, not a
# Laravel-compatible base64-encoded encryption key, which fails at runtime
# with "Unsupported cipher or incorrect key length". See docs/DEPLOYMENT.md.

databases:
  - name: smart-library-db
    plan: free
    # Confirmed current on Render Postgres (it's the default for new
    # databases as of this writing) and matches compose.yaml's local
    # postgres:18-alpine — same schema behavior either way.
    postgresMajorVersion: '18'
    # Must match the web service's region below — Render's private network
    # (used for the DB_URL connection) only works within the same region.
    region: oregon

services:
  - type: web
    name: smart-library
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    # /up is Laravel's own liveness check (see bootstrap/app.php) — it only
    # confirms the app booted, not that the database is ready. That's
    # intentional here: the schema doesn't exist yet on a first deploy, so
    # a health check that required DB connectivity would never go healthy.
    # /up/db (this app's own DB-readiness check) is verified manually after
    # initialDeployHook below has run once — see docs/DEPLOYMENT.md.
    healthCheckPath: /up
    # Free-tier services have no Shell/SSH/one-off-job access and no
    # preDeployCommand (that's a paid-plan feature) — initialDeployHook is
    # the free-tier-compatible mechanism for one-time setup. It runs once,
    # after the first successful deploy, never on later restarts/redeploys.
    # DemoSeeder is idempotent (updateOrCreate/firstOrCreate throughout, and
    # its loan-seeding block only runs if no loans exist yet) — confirmed
    # safe to run here; it will never overwrite reviewer-created data even
    # if this hook is ever re-triggered.
    initialDeployHook: php artisan migrate --force && php artisan db:seed --class=DemoSeeder --force
    envVars:
      - key: APP_NAME
        value: Smart Library
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: 'false'
      # Must be a real Laravel key (`php artisan key:generate --show`),
      # entered once in the Render dashboard — NOT generateValue:true (see
      # the note at the top of this file for why that breaks at runtime).
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false # the https://<service>.onrender.com URL, once known
      - key: LOG_CHANNEL
        value: stderr

      - key: DB_CONNECTION
        value: pgsql
      # Verified against config/database.php: the pgsql connection block
      # reads 'url' => env('DB_URL'), and Laravel's own
      # Illuminate\Support\ConfigurationUrlParser maps the postgres:// /
      # postgresql:// scheme Render's connectionString uses onto the pgsql
      # driver automatically — no manual DB_HOST/PORT/DATABASE/USERNAME/
      # PASSWORD wiring needed.
      - key: DB_URL
        fromDatabase:
          name: smart-library-db
          property: connectionString

      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: 'true'
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database

      - key: LIBRARY_LOAN_PERIOD_DAYS
        value: '14'

      # AI provider — optional. Leave AI_PROVIDER=null (the default) to run
      # with zero external calls; only set these if/when a real key is added.
      - key: AI_PROVIDER
        value: 'null'
      - key: AI_BASE_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false

      # Google OAuth — optional. Leave unset to keep the demo-login-only flow;
      # the "Continue with Google" button only appears once these are set
      # (see HandleInertiaRequests::share -> googleOAuthEnabled).
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
