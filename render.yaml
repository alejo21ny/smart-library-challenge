# Render Blueprint — prepared for release readiness, NOT deployed.
# See docs/DEPLOYMENT.md for the full walkthrough, including why migrations
# are run as a one-off command rather than automatically on every boot, and
# what to do on Render's free tier (which has no Pre-Deploy Command).
#
# No secret VALUES live here. Anything marked `sync: false` must be entered
# once in the Render dashboard; APP_KEY is generated by Render itself.

databases:
  - name: smart-library-db
    plan: free
    # Matches compose.yaml's local postgres:18-alpine. If Render's available
    # versions don't yet include 18 at deploy time, 17 works identically for
    # this schema (pg_trgm and generated/STORED columns predate both).
    postgresMajorVersion: '18'

services:
  - type: web
    name: smart-library
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Smart Library
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: 'false'
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        sync: false # the https://<service>.onrender.com URL, once known
      - key: LOG_CHANNEL
        value: stderr

      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: smart-library-db
          property: connectionString

      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: 'true'
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database

      - key: LIBRARY_LOAN_PERIOD_DAYS
        value: '14'

      # AI provider — optional. Leave AI_PROVIDER=null (the default) to run
      # with zero external calls; only set these if/when a real key is added.
      - key: AI_PROVIDER
        value: 'null'
      - key: AI_BASE_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false

      # Google OAuth — optional. Leave unset to keep the demo-login-only flow;
      # the "Continue with Google" button only appears once these are set
      # (see HandleInertiaRequests::share -> googleOAuthEnabled).
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
