; Production PHP settings. Errors go to stderr (captured by the container
; runtime's log driver) instead of being displayed — APP_DEBUG=false already
; keeps Laravel's own error pages generic; this keeps raw PHP errors off any
; response body too.
display_errors = Off
log_errors = On
error_log = /dev/stderr

expose_php = Off

memory_limit = 256M
upload_max_filesize = 10M
post_max_size = 10M
max_execution_time = 30

; opcache.* directives deliberately omitted — see the Dockerfile's note next
; to the extension install step for why opcache isn't compiled in on this
; base image tag. Re-add these once it is.
